[package]
name = "rnm"
version = "0.4.0"
edition = "2021"
authors = ["jjuker"]
description = "A fast command-line tool to remove node_modules directories"
license = "MIT"
repository = "https://github.com/jjuker/rnm"
keywords = ["node_modules", "cleanup", "cli", "rust"]

[dependencies]
clap = { version = "4.4", features = ["derive"] }
walkdir = "2.4"
dirs = "5.0"
glob = "0.3"
indicatif = "0.17"
anyhow = "1.0"
rayon = "1.10"

[target.'cfg(target_os = "windows")'.dependencies]
winapi = { version = "0.3", features = ["winuser"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
